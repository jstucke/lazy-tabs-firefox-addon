<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { font: menu; font-size: 14px; margin: 1em; }
    label { display: flex; gap: .6em; align-items: flex-start; margin-bottom: 1em; }
    input { margin-top: .2em; }
    .hint { display: block; opacity: .7; font-size: 12px; margin-top: .2em; }
  </style>
</head>
<body>
  <!-- Texte kommen aus _locales/*/messages.json (siehe options.js) -->
  <label>
    <input type="checkbox" id="middleClick">
    <span>
      <span data-i18n="optMiddleClick"></span>
      <span class="hint" data-i18n="optMiddleClickHint"></span>
    </span>
  </label>
  <label>
    <input type="checkbox" id="ctrlClick">
    <span>
      <span data-i18n="optCtrlClick"></span>
      <span class="hint" data-i18n="optCtrlClickHint"></span>
    </span>
  </label>
  <p class="hint" data-i18n="optContextMenuHint"></p>

  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
