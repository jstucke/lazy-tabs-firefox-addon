<html lang="de">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { font: menu; font-size: 14px; margin: 1em; }
    label { display: flex; gap: .6em; align-items: flex-start; margin-bottom: 1em; }
    input { margin-top: .2em; }
    .hint { display: block; opacity: .7; font-size: 12px; margin-top: .2em; }
  </style>
</head>
<body>
  <label>
    <input type="checkbox" id="middleClick">
    <span>Mittelklick auf Links öffnet einen Lazy-Tab
      <span class="hint">Aus: Mittelklick verhält sich wie in Firefox üblich.</span>
    </span>
  </label>
  <label>
    <input type="checkbox" id="ctrlClick">
    <span>Strg+Klick auf Links öffnet einen Lazy-Tab
      <span class="hint">Aus: Strg+Klick verhält sich wie in Firefox üblich.</span>
    </span>
  </label>
  <p class="hint">Kontextmenü-Einträge für Links und Lesezeichen sind immer verfügbar.</p>

  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
