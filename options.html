<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font: menu;
        font-size: 14px;
        margin: 1em;
      }
      label {
        display: flex;
        gap: 0.6em;
        align-items: flex-start;
        margin-bottom: 1em;
      }
      input {
        margin-top: 0.2em;
      }
      .hint {
        display: block;
        opacity: 0.7;
        font-size: 12px;
        margin-top: 0.2em;
      }
    </style>
  </head>
  <body>
    <!-- Texts come from _locales/*/messages.json (see options.js) -->
    <label>
      <input type="checkbox" id="middleClick" disabled />
      <span>
        <span data-i18n="optMiddleClick"></span>
        <span class="hint" data-i18n="optMiddleClickHint"></span>
      </span>
    </label>
    <label>
      <input type="checkbox" id="ctrlClick" disabled />
      <span>
        <span data-i18n="optCtrlClick"></span>
        <span class="hint" data-i18n="optCtrlClickHint"></span>
      </span>
    </label>
    <p class="hint" data-i18n="optContextMenuHint"></p>

    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
