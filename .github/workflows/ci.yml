name: CI

on:
  push:
    branches: [main]
  # `pull_request` (not `pull_request_target`): code from forks runs without
  # access to secrets and with a read-only token.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same hooks as locally, see .pre-commit-config.yaml
      - name: Run pre-commit hooks
        run: pipx run --spec pre-commit==4.5.1 pre-commit run --all-files --show-diff-on-failure

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build add-on
        run: npm run build
